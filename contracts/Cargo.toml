[package]
name = "aegis-vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "=2.2.2", features = ["cosmwasm_2_0"] }
cw-storage-plus = "2.0.0"
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
prost = "0.13"
bech32 = "0.9"
hex = "0.4"

[dev-dependencies]
cw-multi-test = { version = "2.5.1", features = ["cosmwasm_2_0"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
